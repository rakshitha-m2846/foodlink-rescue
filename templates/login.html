<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login to FoodLink Rescue</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ΓöÇΓöÇ Existing styles ΓÇô unchanged ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #ecfdf5 0%, #f0fdf4 60%, #fefce8 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      color: #111827;
    }
    .login-card {
      background: white; border-radius: 14px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.08);
      padding: 40px 30px; width: 100%; max-width: 400px;
      text-align: center; border: 1px solid #f3f4f6;
    }
    h1 { font-size: 1.6rem; font-weight: 800; color: #064e3b; margin-bottom: 25px; }
    .form-group { margin-bottom: 20px; text-align: left; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: #374151; margin-bottom: 6px; }
    input[type="text"] {
      width: 100%; padding: 12px;
      border: 1.5px solid #e5e7eb; border-radius: 10px;
      font-size: 0.95rem; font-family: inherit; color: #111827;
      background: #f9fafb; outline: none; transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: #10b981; background: white; }
    input[type="tel"] {
      width: 100%; padding: 12px;
      border: 1.5px solid #e5e7eb; border-radius: 10px;
      font-size: 0.95rem; font-family: inherit; color: #111827;
      background: #f9fafb; outline: none; transition: border-color 0.2s;
    }
    input[type="tel"]:focus { border-color: #10b981; background: white; }
    .role-buttons { display: flex; gap: 10px; margin-top: 10px; }
    .btn-role {
      flex: 1; padding: 12px; border: none; border-radius: 10px;
      font-size: 0.95rem; font-weight: 700; cursor: pointer; color: white;
      transition: transform 0.15s, opacity 0.2s;
    }
    .btn-role:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-donor { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
    .btn-ngo   { background: #064e3b; }

    /* ΓöÇΓöÇ OTP flow styles ΓÇô unchanged ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ */
    .phone-row { display: flex; gap: 8px; align-items: center; }
    .phone-prefix {
      padding: 12px 10px;
      border: 1.5px solid #e5e7eb; border-radius: 10px;
      font-size: 0.95rem; font-family: inherit;
      color: #374151; background: #f3f4f6; font-weight: 600;
      white-space: nowrap; flex-shrink: 0;
    }
    .phone-row input[type="tel"] { flex: 1; }
    .btn-otp {
      width: 100%; padding: 12px; border: none; border-radius: 10px;
      font-size: 0.95rem; font-weight: 700; cursor: pointer; color: white;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      transition: transform 0.15s, opacity 0.2s; margin-top: 4px;
    }
    .btn-otp:hover    { opacity: 0.9; transform: translateY(-1px); }
    .btn-otp:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
    .status-msg {
      font-size: 0.82rem; margin-top: 10px; min-height: 18px;
      text-align: center; font-weight: 500;
    }
    .status-msg.error   { color: #dc2626; }
    .status-msg.success { color: #059669; }
    .status-msg.info    { color: #6b7280; }
    .step { display: none; }
    .step.active { display: block; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>Login to FoodLink Rescue</h1>

    <!-- ΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉ
         STEP 1 ΓÇô Phone number + Send OTP
         (Name / email / DOB are set from Profile after login)
         ΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉ -->
    <div id="step-phone" class="step active">
      <div class="form-group">
        <label for="phone_number">Phone Number</label>
        <div class="phone-row">
          <span class="phone-prefix">+91</span>
          <input type="tel" id="phone_number" name="phone_number"
                 placeholder="10-digit mobile number" maxlength="10" inputmode="numeric">
        </div>
      </div>
      <div id="recaptcha-container"></div>
      <button id="btn-send-otp" class="btn-otp">Send OTP</button>
      <p id="msg-phone" class="status-msg info"></p>
    </div>

    <!-- ΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉ
         STEP 2 ΓÇô OTP input + Verify button
         ΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉ -->
    <div id="step-otp" class="step">
      <div class="form-group">
        <label for="otp_code">Enter OTP</label>
        <input type="text" id="otp_code" name="otp_code"
               placeholder="6-digit OTP" maxlength="6" inputmode="numeric">
      </div>
      <button id="btn-verify-otp" class="btn-otp">Verify OTP</button>
      <p id="msg-otp" class="status-msg info"></p>
    </div>

    <!-- ΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉ
         STEP 3 ΓÇô Role selection (original donor / NGO buttons)
         Posts to existing Flask /login route ΓÇô no backend changes.
         ΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉ -->
    <div id="step-role" class="step">
      <p style="font-size:0.85rem; color:#059669; font-weight:600; margin-bottom:18px;">
        Phone verified! Choose your role to continue.
      </p>
      <form id="role-form" action="/login" method="POST">
        <input type="hidden" id="hidden_user_name" name="user_name" value="User">
        <input type="hidden" id="hidden_role"      name="role"      value="">
      </form>
      <div class="role-buttons">
        <button type="button" class="btn-role btn-donor" onclick="submitRole('donor')">Login as Donor</button>
        <button type="button" class="btn-role btn-ngo"   onclick="submitRole('ngo')">Login as NGO</button>
      </div>
      <p id="msg-role" class="status-msg info"></p>
    </div>

  </div><!-- /.login-card -->

  <script>
    // ============================================================
    // DEMO MODE ΓÇô simulated OTP (no real SMS sent)
    // To activate Firebase Phone Auth in production:
    //   1. Uncomment the <script type="module"> block below
    //   2. Remove this demo <script> block
    //   3. Add localhost / your domain to Firebase Console ΓåÆ
    //      Authentication ΓåÆ Settings ΓåÆ Authorized domains
    // ============================================================

    const DEMO_OTP = '123456';

    // ΓöÇΓöÇ Helpers ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
    function showStep(id) {
      document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function setMsg(elId, text, type) {
      const el = document.getElementById(elId);
      el.textContent = text;
      el.className = 'status-msg ' + (type || 'info');
    }

    // ΓöÇΓöÇ STEP 1 ΓÇô Send OTP (demo) ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
    document.getElementById('btn-send-otp').addEventListener('click', function () {
      const phone = document.getElementById('phone_number').value.trim();

      if (!phone || phone.length < 10 || !/^\d{10}$/.test(phone)) {
        setMsg('msg-phone', 'ΓÜá∩╕Å Enter a valid 10-digit mobile number.', 'error');
        return;
      }

      // Demo: no real SMS ΓÇô just reveal OTP field
      setMsg('msg-phone', 'Demo OTP sent. Use 123456 to verify.', 'success');
      setTimeout(function () { showStep('step-otp'); }, 800);
    });

    // ΓöÇΓöÇ STEP 2 ΓÇô Verify OTP (demo) ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
    document.getElementById('btn-verify-otp').addEventListener('click', function () {
      const btn  = document.getElementById('btn-verify-otp');
      const code = document.getElementById('otp_code').value.trim();

      if (!code || code.length !== 6) {
        setMsg('msg-otp', 'ΓÜá∩╕Å Enter the 6-digit OTP.', 'error');
        return;
      }

      if (code === DEMO_OTP) {
        btn.disabled = true;
        setMsg('msg-otp', 'OTP verified!', 'success');
        setTimeout(function () { showStep('step-role'); }, 400);
      } else {
        setMsg('msg-otp', 'Invalid OTP. Please try again.', 'error');
        document.getElementById('otp_code').value = '';
        document.getElementById('otp_code').focus();
      }
    });

    // ΓöÇΓöÇ Allow Enter key in OTP field ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
    document.getElementById('otp_code').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') document.getElementById('btn-verify-otp').click();
    });

    // ΓöÇΓöÇ STEP 3 ΓÇô Role ΓåÆ Flask /login POST ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
    window.submitRole = function (role) {
      document.getElementById('hidden_role').value = role;
      document.getElementById('role-form').submit();
    };
  </script>

  <!--
  ================================================================
  FIREBASE PHONE AUTH ΓÇô preserved for future production activation
  Uncomment this block and remove the demo <script> above to enable.
  Also delete: <script src="..."> tag below if using this module.
  ================================================================

  <script type="module">
    import { auth, setupRecaptcha }
      from "{{ url_for('static', filename='firebase.js') }}";
    import { signInWithPhoneNumber }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    function showStep(id) {
      document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }
    function setMsg(elId, text, type) {
      const el = document.getElementById(elId);
      el.textContent = text;
      el.className = 'status-msg ' + (type || 'info');
    }

    document.getElementById('btn-send-otp').addEventListener('click', async () => {
      const btn   = document.getElementById('btn-send-otp');
      const phone = document.getElementById('phone_number').value.trim();
      if (!phone || !/^\d{10}$/.test(phone)) {
        setMsg('msg-phone', 'ΓÜá∩╕Å Enter a valid 10-digit mobile number.', 'error');
        return;
      }
      btn.disabled = true;
      setMsg('msg-phone', 'ΓÅ│ Sending OTPΓÇª', 'info');
      try {
        const verifier = setupRecaptcha('btn-send-otp');
        window._confirmResult = await signInWithPhoneNumber(auth, '+91' + phone, verifier);
        setMsg('msg-phone', 'Γ£à OTP sent! Check your SMS.', 'success');
        setTimeout(() => showStep('step-otp'), 700);
      } catch (err) {
        setMsg('msg-phone', 'Γ¥î ' + (err.message || 'Could not send OTP.'), 'error');
        btn.disabled = false;
        window._recaptchaVerifier = null;
      }
    });

    document.getElementById('btn-verify-otp').addEventListener('click', async () => {
      const btn  = document.getElementById('btn-verify-otp');
      const code = document.getElementById('otp_code').value.trim();
      if (!code || code.length !== 6) {
        setMsg('msg-otp', 'ΓÜá∩╕Å Enter the 6-digit OTP.', 'error');
        return;
      }
      btn.disabled = true;
      setMsg('msg-otp', 'ΓÅ│ VerifyingΓÇª', 'info');
      try {
        await window._confirmResult.confirm(code);
        setMsg('msg-otp', 'Γ£à Verified!', 'success');
        setTimeout(() => showStep('step-role'), 400);
      } catch (err) {
        const msg = err.code === 'auth/invalid-verification-code'
          ? 'Wrong OTP. Please try again.' : (err.message || 'Verification failed.');
        setMsg('msg-otp', 'Γ¥î ' + msg, 'error');
        btn.disabled = false;
      }
    });

    window.submitRole = function (role) {
      document.getElementById('hidden_role').value = role;
      document.getElementById('role-form').submit();
    };
  </script>
  -->

</body>
</html>
